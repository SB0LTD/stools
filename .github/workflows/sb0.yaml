name: SB0

# Builds the stools SB0K bare-metal image and proves the slicker scan actually
# runs on SB0 (aarch64) by booting it under QEMU and reading the serial console.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: sb0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sb0-qemu:
    name: Build SB0K image and boot under QEMU
    runs-on: ubuntu-latest
    # Non-blocking for now: the published Sig 0.5.0 release has an aarch64
    # self-hosted backend regression that breaks freestanding aarch64-sb0
    # builds (missing lowerings for non-power-of-two byte_swap and div_ceil,
    # hit via std readPackedInt in the f80/f128 compiler_rt routines). The
    # library-side trigger is fixed in sig master (compiler_rt soft-float ABI),
    # but the backend lowerings still need to land and a new Sig release cut.
    # Re-enable enforcement (remove continue-on-error) once a Sig release builds
    # aarch64-sb0. Hosted targets + releases are fully enforced in ci.yaml.
    continue-on-error: true
    steps:
      - name: Checkout stools
        uses: actions/checkout@v4
        with:
          path: stools

      - name: Checkout zpm (path dependency)
        uses: actions/checkout@v4
        with:
          repository: SB0LTD/zpm
          ref: 53051b75873fae047a1bd2394ced12c81afe873f
          path: zpm

      - name: Install QEMU (aarch64 system emulation)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm
          qemu-system-aarch64 --version | head -1

      - name: Install latest Sig
        run: |
          set -euo pipefail
          URL="https://github.com/SB0LTD/sig/releases/latest/download/sig-x86_64-linux.tar.xz"
          curl -fSL "$URL" -o sig.tar.xz
          mkdir -p sig-dist && tar -xf sig.tar.xz -C sig-dist
          SIG_BIN="$(find "$PWD/sig-dist" -type f -name sig | head -n1)"
          chmod +x "$SIG_BIN"
          echo "$(dirname "$SIG_BIN")" >> "$GITHUB_PATH"
          "$SIG_BIN" version

      - name: Build SB0K image
        working-directory: stools
        run: bash scripts/build-sb0.sh sig-out/bin/stools-aarch64-sb0.sb0k

      - name: Boot under QEMU and run the slicker self-test
        working-directory: stools
        run: bash scripts/sb0-qemu-test.sh sig-out/bin/stools-aarch64-sb0.sb0k
