name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test, cross-compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stools
        uses: actions/checkout@v4
        with:
          path: stools

      # zpm is a path dependency (../zpm). Check it out as a sibling so
      # build.sig.zon resolves the same way it does locally. Pin the SHA so an
      # unrelated zpm main push cannot make a previously green stools revision
      # non-reproducible.
      - name: Checkout zpm (path dependency)
        uses: actions/checkout@v4
        with:
          repository: SB0LTD/zpm
          ref: 0302c5f7c7fb84f8104cbd39d0adf7dbc4623229
          path: zpm

      - name: Install latest Sig
        run: |
          set -euo pipefail
          URL="https://github.com/SB0LTD/sig/releases/latest/download/sig-x86_64-linux.tar.xz"
          echo "Downloading $URL"
          curl -fSL "$URL" -o sig.tar.xz
          mkdir -p sig-dist
          tar -xf sig.tar.xz -C sig-dist
          SIG_BIN="$(find "$PWD/sig-dist" -type f -name sig | head -n1)"
          if [ -z "$SIG_BIN" ]; then echo "sig binary not found"; exit 1; fi
          chmod +x "$SIG_BIN"
          echo "$(dirname "$SIG_BIN")" >> "$GITHUB_PATH"
          "$SIG_BIN" version

      - name: Build (native)
        working-directory: stools
        run: |
          set -euo pipefail
          sig build

      - name: Test (native)
        working-directory: stools
        run: |
          set -euo pipefail
          sig build test

      - name: Cross-compile all release targets
        working-directory: stools
        run: |
          set -euo pipefail
          # target-triple : binary-extension
          for entry in \
            x86_64-linux-gnu: aarch64-linux-gnu: \
            x86_64-macos: aarch64-macos: \
            x86_64-windows:.exe aarch64-windows:.exe; do
            triple="${entry%%:*}"; ext="${entry#*:}"
            echo "::group::$triple"
            rm -rf sig-out
            sig build -Dtarget="$triple" -Doptimize=ReleaseFast
            # Every target must produce both suite binaries; fail loudly if not.
            for bin in stools img2elementor; do
              path="sig-out/bin/$bin$ext"
              if [ ! -f "$path" ]; then
                echo "FAIL: $triple did not produce $path"; exit 1
              fi
            done
            echo "  ok: $triple -> stools$ext, img2elementor$ext"
            echo "::endgroup::"
          done
