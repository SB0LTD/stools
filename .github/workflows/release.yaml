name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.0.1)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build all platforms and publish
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Building release $TAG"

      - name: Checkout stools
        uses: actions/checkout@v4
        with:
          path: stools
          ref: ${{ steps.meta.outputs.tag }}

      # zpm is a path dependency (../zpm). Check it out as a sibling so
      # build.sig.zon resolves the same way it does locally. Pinned for
      # reproducible releases.
      - name: Checkout zpm (path dependency)
        uses: actions/checkout@v4
        with:
          repository: SB0LTD/zpm
          ref: 0302c5f7c7fb84f8104cbd39d0adf7dbc4623229
          path: zpm

      - name: Install QEMU (for SB0 boot verification)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm
          qemu-system-aarch64 --version | head -1

      - name: Install latest Sig
        id: sig
        run: |
          set -euo pipefail
          URL="https://github.com/SB0LTD/sig/releases/latest/download/sig-x86_64-linux.tar.xz"
          echo "Downloading $URL"
          curl -fSL "$URL" -o sig.tar.xz
          mkdir -p sig-dist
          tar -xf sig.tar.xz -C sig-dist
          SIG_BIN="$(find "$PWD/sig-dist" -type f -name sig | head -n1)"
          if [ -z "$SIG_BIN" ]; then echo "sig binary not found"; exit 1; fi
          chmod +x "$SIG_BIN"
          echo "$(dirname "$SIG_BIN")" >> "$GITHUB_PATH"
          echo "sig_version=$("$SIG_BIN" version)" >> "$GITHUB_OUTPUT"
          "$SIG_BIN" version

      - name: Test (native)
        working-directory: stools
        run: |
          set -euo pipefail
          sig build test

      - name: Build all targets, package, checksum
        id: package
        working-directory: stools
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          OUT="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT"

          # target-triple : platform-slug : is-windows
          TARGETS="
          x86_64-linux-gnu:x86_64-linux:0
          aarch64-linux-gnu:aarch64-linux:0
          x86_64-macos:x86_64-macos:0
          aarch64-macos:aarch64-macos:0
          x86_64-windows:x86_64-windows:1
          aarch64-windows:aarch64-windows:1
          "

          for entry in $TARGETS; do
            [ -z "$entry" ] && continue
            triple="${entry%%:*}"; rest="${entry#*:}"
            slug="${rest%%:*}"; is_win="${rest#*:}"

            echo "::group::build $slug ($triple)"
            rm -rf sig-out
            sig build -Dtarget="$triple" -Doptimize=ReleaseFast

            stage="stools-$VERSION-$slug"
            mkdir -p "$stage"
            cp README.md LICENSE CHANGELOG.md "$stage/"
            if [ "$is_win" = "1" ]; then
              cp sig-out/bin/stools.exe "$stage/"
              (cd "$stage" && zip -qr "$OUT/$stage.zip" .)
            else
              cp sig-out/bin/stools "$stage/"
              chmod +x "$stage/stools"
              tar -czf "$OUT/$stage.tar.gz" -C "$stage" .
            fi
            rm -rf "$stage"
            echo "::endgroup::"
          done

          # SB0 native — a bare-metal SB0K image that boots under QEMU and runs
          # the slicker scan over the serial console (see scripts/build-sb0.sh).
          # Boot-verified before shipping so a release never publishes an SB0
          # image that doesn't run.
          echo "::group::build aarch64-sb0 (SB0K native)"
          rm -rf sig-out
          bash scripts/build-sb0.sh "sig-out/bin/stools-$VERSION-aarch64-sb0.sb0k"
          bash scripts/sb0-qemu-test.sh "sig-out/bin/stools-$VERSION-aarch64-sb0.sb0k"
          sb0_stage="stools-$VERSION-aarch64-sb0"
          mkdir -p "$sb0_stage"
          cp "sig-out/bin/stools-$VERSION-aarch64-sb0.sb0k" "$sb0_stage/stools.sb0k"
          cp README.md LICENSE CHANGELOG.md "$sb0_stage/"
          tar -czf "$OUT/$sb0_stage.tar.gz" -C "$sb0_stage" .
          rm -rf "$sb0_stage"
          echo "::endgroup::"

          cd "$OUT"
          sha256sum * > SHA256SUMS.txt
          echo "Artifacts:"; ls -la
          echo "dist=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          SIG="${{ steps.sig.outputs.sig_version }}"
          DIST="${{ steps.package.outputs.dist }}"

          NOTES="$(cat <<EOF
          ## stools $TAG

          The SB0 tools suite — a native, zero-dependency collection of
          command-line tools built in Sig on [zpm](https://github.com/SB0LTD/zpm).
          The first tool is \`slicker\`, a config-driven visual UI-automation engine.

          **Built with:** $SIG (cross-compiled to all targets from a single host).

          ### Downloads

          | Platform | Archive |
          |----------|---------|
          | Windows x86_64  | \`stools-$VERSION-x86_64-windows.zip\`  |
          | Windows aarch64 | \`stools-$VERSION-aarch64-windows.zip\` |
          | Linux x86_64    | \`stools-$VERSION-x86_64-linux.tar.gz\`  |
          | Linux aarch64   | \`stools-$VERSION-aarch64-linux.tar.gz\` |
          | macOS x86_64    | \`stools-$VERSION-x86_64-macos.tar.gz\`  |
          | macOS aarch64   | \`stools-$VERSION-aarch64-macos.tar.gz\` |
          | **SB0 native**  | \`stools-$VERSION-aarch64-sb0.tar.gz\` (bootable SB0K image) |

          ### Install
          Extract the archive for your platform and run \`stools\` (or \`stools.exe\`).

          ### Verify
          Checksums for every artifact are in \`SHA256SUMS.txt\`.

          See the [README](https://github.com/${{ github.repository }}/blob/$TAG/README.md)
          for usage.
          EOF
          )"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DIST"/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$DIST"/* \
              --repo "${{ github.repository }}" \
              --title "stools $TAG" \
              --notes "$NOTES"
          fi
