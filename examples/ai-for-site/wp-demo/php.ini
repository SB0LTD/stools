; Local PHP config for the wp-demo — enables the extensions WordPress +
; the SQLite drop-in + Elementor need, without touching the global php.ini.
; Point PHP at it with:  php -c <this file>
;
; Set extension_dir to your PHP's own ext/ directory (find it with
; `php -i | findstr extension_dir` on Windows, or `php -i | grep extension_dir`).
; Example (Windows WinGet PHP 8.3):
;   extension_dir = "C:\Users\<you>\AppData\Local\Microsoft\WinGet\Packages\PHP.PHP.8.3_.../ext"
extension_dir = "C:\Users\Shado\AppData\Local\Microsoft\WinGet\Packages\PHP.PHP.8.3_Microsoft.Winget.Source_8wekyb3d8bbwe\ext"
extension=pdo_sqlite
extension=sqlite3
extension=curl
extension=gd
extension=mbstring
extension=openssl
extension=exif
extension=fileinfo
extension=zip
extension=intl
extension=sockets

; WordPress/Elementor like generous limits.
memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 64M
post_max_size = 64M
